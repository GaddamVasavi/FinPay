version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: finpay_postgres
    environment:
      POSTGRES_USER: finpay_user
      POSTGRES_PASSWORD: finpay_password
      POSTGRES_DB: finpay_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U finpay_user -d finpay_db']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: finpay_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: finpay_backend
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://finpay_user:finpay_password@postgres:5432/finpay_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: finpay_prod_secret_token_key_2026
      JWT_REFRESH_SECRET: finpay_prod_refresh_token_key_2026
      FRONTEND_URL: http://localhost:5173
    ports:
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finpay_frontend
    ports:
      - '5173:80'
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
